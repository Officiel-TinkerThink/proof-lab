<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment fixture</title>
<link rel="icon" href="data:,">
</head>
<body>
<h1>Environment</h1>
<dl>
  <dt>Viewport</dt><dd data-testid="viewport"></dd>
  <dt>Color scheme</dt><dd data-testid="scheme"></dd>
  <dt>Reduced motion</dt><dd data-testid="motion"></dd>
  <dt>Media</dt><dd data-testid="media"></dd>
  <dt>Locale</dt><dd data-testid="locale"></dd>
  <dt>Number</dt><dd data-testid="number"></dd>
  <dt>Time zone</dt><dd data-testid="timezone"></dd>
  <dt>Online</dt><dd data-testid="online"></dd>
  <dt>Geolocation permission</dt><dd data-testid="permission">unknown</dd>
  <dt>Position</dt><dd data-testid="position">not asked</dd>
  <dt>Fetch</dt><dd data-testid="fetch">not tried</dd>
  <dt>Now</dt><dd data-testid="now"></dd>
  <dt>Timer</dt><dd data-testid="timer">waiting</dd>
</dl>
<button type="button" id="ask-position">Ask for position</button>
<button type="button" id="try-fetch">Try fetch</button>
<button type="button" id="show-now">Show time</button>
<script>
const set = (id, value) => { document.querySelector(`[data-testid="${id}"]`).textContent = value; };
const draw = () => {
  set("viewport", `${window.innerWidth}x${window.innerHeight}`);
  set("scheme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  set("motion", matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduce" : "no-preference");
  set("media", matchMedia("print").matches ? "print" : "screen");
  set("online", String(navigator.onLine));
};
draw();
addEventListener("resize", draw);
addEventListener("online", draw);
addEventListener("offline", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", draw);
matchMedia("print").addEventListener("change", draw);
set("locale", navigator.language);
set("number", (1234567.891).toLocaleString());
set("timezone", Intl.DateTimeFormat().resolvedOptions().timeZone);
set("now", new Date().toISOString());
setTimeout(() => set("timer", "fired"), 5000);
navigator.permissions.query({ name: "geolocation" }).then(status => {
  set("permission", status.state);
  status.addEventListener("change", () => set("permission", status.state));
}).catch(() => set("permission", "unsupported"));
document.getElementById("ask-position").addEventListener("click", () => {
  navigator.geolocation.getCurrentPosition(
    position => set("position", `${position.coords.latitude},${position.coords.longitude}`),
    error => set("position", `error ${error.code}`));
});
document.getElementById("try-fetch").addEventListener("click", async () => {
  try {
    const response = await fetch("/fixtures/nav-b.html", { cache: "no-store" });
    set("fetch", `ok ${response.status}`);
  } catch {
    set("fetch", "failed");
  }
});
document.getElementById("show-now").addEventListener("click", () => set("now", new Date().toISOString()));
</script>
</body>
</html>
